services:
  claude-box:
    image: ghcr.io/simongeronimo/homelab-claude-box:latest
    pull_policy: always
    container_name: claude-box
    ports:
      - "8080:8080"
    volumes:
      - /mnt/Apps/claude-box/home:/root
    # Both values are secrets, so they live in the stack's .env, never here.
    #
    # LAUNCHER_PASSWORD is the launcher's login. Anyone who can reach port
    # 8080 can start sessions as root, so it is required and the deploy fails
    # without it. Make it long and random, for example `openssl rand -base64 24`.
    #
    # ntfy has no accounts, so NTFY_TOPIC is the only thing keeping your
    # notifications yours. Anyone who knows it can read them and post to them.
    # Keep it long and random. Leave it out to turn reminders off.
    environment:
      LAUNCHER_PASSWORD: ${LAUNCHER_PASSWORD:?set LAUNCHER_PASSWORD in .env}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
    init: true
    restart: unless-stopped
    # Blast radius for a runaway agent: a fork bomb or a build that eats all
    # the RAM kills this container instead of the NAS. Raise mem_limit if you
    # run many concurrent sessions — hitting it kills the running ones.
    pids_limit: 1024
    mem_limit: 8g
    security_opt: [ "no-new-privileges:true" ]
