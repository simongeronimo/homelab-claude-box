<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Claude Box</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<!-- iOS ignores the SVG above when adding to the Home Screen, and falls back
     to a screenshot of the page unless this PNG is here. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #f2f4f7;
    --card: #ffffff;
    --text: #161b22;
    --muted: #59646f;
    --line: #d9e0e7;
    --accent: #a94d26;
    --stale: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141a;
      --card: #171d25;
      --text: #dde3ea;
      --muted: #8a97a5;
      --line: #252d38;
      --accent: #e0855a;
      --stale: #f0b940;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: env(safe-area-inset-top) 16px 48px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* No rubber-band bounce when the page already fits. */
    overscroll-behavior-y: none;
  }

  /* Nothing here is ever wider than the viewport; if something ever is, that
     is a bug to fix rather than a sideways scroll to live with. */
  html { overflow-x: hidden; }

  /* The page behind a modal has no business moving. */
  body:has(dialog[open]) { overflow: hidden; }

  main { max-width: 620px; margin: 0 auto; }

  h1 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 650;
    margin: 28px 0 20px;
    letter-spacing: -0.01em;
  }

  /* Sized a little above the cap height, the way a logo sits beside a
     wordmark. Fixed dimensions so the row doesn't reflow as it loads. */
  h1 img {
    width: 26px;
    height: 26px;
    display: block;
    flex-shrink: 0;
  }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

  li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  /* --- Swipe to delete --------------------------------------------------- */

  li.project { padding: 0; position: relative; overflow: hidden; }

  li.project .front {
    position: relative;
    background: var(--card);
    padding: 14px 16px;
    transition: transform 0.22s cubic-bezier(0.2, 0.7, 0.3, 1);
    /* Vertical panning stays the browser's, horizontal is ours. Without this
       the browser claims a sideways drag as a scroll, so the page shifts under
       the finger and the swipe dies mid-gesture with a pointercancel. */
    touch-action: pan-y;
  }
  li.project.dragging .front { transition: none; }
  li.project.open .front { transform: translateX(-76px); }
  /* Swipe is touch-only, so keyboard focus has to reveal it too. */
  li.project:has(.trash:focus-visible) .front { transform: translateX(-76px); }

  .behind {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 76px;
    display: flex;
    background: #c0392b;
  }

  button.trash {
    flex: 1;
    background: transparent;
    border: 0;
    border-radius: 0;
    color: #fff;
    padding: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.trash:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }

  /* --- Delete confirmation ----------------------------------------------- */

  dialog {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    padding: 20px;
    max-width: 400px;
    width: calc(100% - 32px);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.5); }

  dialog h3 {
    margin: 0 0 10px;
    font-size: 16px;
    font-weight: 650;
    overflow-wrap: anywhere;
  }

  .risk {
    margin: 0 0 12px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .risk.bad { color: #c0392b; font-weight: 600; }

  .warn {
    margin: 0 0 18px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(192, 57, 43, 0.1);
    border: 1px solid rgba(192, 57, 43, 0.35);
    font-size: 13.5px;
  }

  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin: 0;
  }
  button.danger { background: #c0392b; }

  .name {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14.5px;
    overflow-wrap: anywhere;
  }

  .when {
    display: block;
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 3px;
  }

  .actions { display: flex; gap: 8px; flex-shrink: 0; }

  button.ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
    padding: 10px 14px;
  }

  .sessions {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sessions:empty { display: none; }

  .session {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    width: 100%;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-weight: 400;
  }
  .session:hover { border-color: var(--accent); }

  .label { font-size: 14px; overflow-wrap: anywhere; }
  .session .when { margin-top: 2px; }

  h2 {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 10px;
  }

  #running { margin-bottom: 28px; }
  #running:empty { display: none; }


  /* --- Login status ------------------------------------------------------ */

  #status-panel { margin-bottom: 20px; }
  #status-panel:empty { display: none; }

  .status-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 14px;
  }

  .svc {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
  }
  .svc + .svc { border-top: 1px solid var(--line); }

  .svc-mark {
    flex-shrink: 0;
    width: 18px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
  }
  .svc.ok .svc-mark { color: #2f9e63; }
  .svc.bad .svc-mark { color: #c0392b; }
  .svc.unknown .svc-mark { color: var(--muted); }

  .svc-text { flex: 1; min-width: 0; font-size: 13.5px; }
  .svc-who {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-top: 1px;
    overflow-wrap: anywhere;
  }
  .svc.bad .svc-who { color: #c0392b; }

  button.signin {
    flex-shrink: 0;
    font-size: 13px;
    padding: 7px 12px;
    min-height: 0;
  }

  /* --- Sign-in dialog ---------------------------------------------------- */

  .step {
    margin: 0 0 14px;
    font-size: 13.5px;
    color: var(--muted);
  }

  .bigcode {
    display: block;
    margin: 12px 0;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-align: center;
    color: var(--text);
  }

  .golink {
    display: block;
    margin: 12px 0;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    overflow-wrap: anywhere;
  }

  #code-input {
    width: 100%;
    font: inherit;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  #code-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #usage { margin-bottom: 28px; }
  #usage:empty { display: none; }

  .usage-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .limit-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .limit-label { font-size: 14px; }

  .limit-pct {
    font-size: 14px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }

  .track {
    height: 8px;
    margin-top: 8px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    border-radius: 4px;
    min-width: 2px;
    background: var(--accent);
  }
  /* Status steps, fixed rather than themed. The percentage sits beside every
     bar, so colour is never the only thing saying how close you are. */
  .fill.warning { background: #fab219; }
  .fill.critical { background: #d03b3b; }

  .limit-reset {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--muted);
  }

  button.remind {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    min-height: 0;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
  }
  button.remind.on {
    color: #2f9e63;
    border-color: #2f9e63;
  }

  .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #2f9e63;
    margin-right: 7px;
    vertical-align: middle;
  }
  .dot.working { background: #d3a03e; }

  button.stop { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button.stop:hover { color: #c0392b; border-color: #c0392b; }

  details#add {
    margin-top: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }

  summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
    list-style-position: inside;
  }

  #create-form {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin: 16px 0;
  }

  input[type="text"], #create-name {
    flex: 1 1 180px;
    min-width: 0;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 42px;
  }
  #create-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .check {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
  }

  #repos ul { margin-top: 12px; }
  #repos li { padding: 12px 14px; }
  .desc {
    display: block;
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 3px;
  }

  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    min-height: 42px;
    white-space: nowrap;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .note {
    color: var(--muted);
    font-size: 14px;
    padding: 20px 2px;
  }

  /* --- Compared with upstream ------------------------------------------ */

  .when.with-sync {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
  }
  .sync { display: contents; }

  .spinner {
    width: 11px;
    height: 11px;
    border: 2px solid var(--line);
    border-top-color: var(--muted);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Slowed, not stopped: a spinner that holds still reads as a hang. */
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  .badge {
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .badge.stale { color: var(--stale); background: rgba(250, 178, 25, 0.16); }
  .badge.diverged { color: #c0392b; background: rgba(192, 57, 43, 0.12); }

  button.pull {
    font-size: 12.5px;
    padding: 4px 12px;
    min-height: 30px;
  }

  /* --- Loading placeholders --------------------------------------------- */

  .skel {
    display: block;
    border-radius: 4px;
    background: var(--line);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .skel-name { width: 55%; height: 14px; margin: 4px 0; }
  .skel-when { width: 28%; height: 10px; margin-top: 9px; }
  .skel-button { width: 64px; height: 42px; border-radius: 8px; flex-shrink: 0; }
  .skeleton .row > div { flex: 1; }

  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

  #status {
    margin-top: 20px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #status:empty { display: none; }
</style>
</head>
<body>
<main>
  <!-- alt="" — the heading text beside it already says this. -->
  <h1><img src="/icon.svg" alt="" width="26" height="26">Claude Box</h1>
  <div id="status-panel"></div>
  <div id="usage"></div>
  <div id="running"></div>
  <div id="list"></div>

  <details id="add">
    <summary>Add a project</summary>

    <form id="create-form">
      <input id="create-name" name="name" placeholder="new-repo-name"
             pattern="[A-Za-z0-9._\-]+" required autocapitalize="off"
             autocorrect="off" spellcheck="false">
      <label class="check">
        <input type="checkbox" id="create-private" checked> Private
      </label>
      <button type="submit">Create</button>
    </form>

    <div id="repos"></div>
  </details>

  <div id="status" role="status" aria-live="polite"></div>

  <dialog id="signin">
    <h3 id="signin-title">Sign in</h3>
    <p class="step" id="signin-step">Starting…</p>
    <div id="signin-body"></div>
    <form method="dialog" class="dialog-actions">
      <button value="cancel" class="ghost">Close</button>
    </form>
  </dialog>

  <dialog id="confirm">
    <h3>Delete <span id="confirm-name"></span>?</h3>
    <p class="risk" id="confirm-risk"></p>
    <p class="warn">
      If this project isn't backed up on GitHub, you will lose this data.
      The directory is removed from the box permanently and this can't be undone.
    </p>
    <form method="dialog" class="dialog-actions">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="delete" class="danger">Delete</button>
    </form>
  </dialog>
</main>

<script>
const list = document.getElementById('list');
const runningEl = document.getElementById('running');
const status = document.getElementById('status');

function say(message) {
  status.textContent = message;
}

/** Grey cards the shape of the real ones, so the list doesn't jump when it lands. */
function skeleton(count) {
  const ul = document.createElement('ul');
  ul.className = 'skeleton';
  ul.setAttribute('aria-label', 'Loading');
  for (let i = 0; i < count; i++) {
    const li = document.createElement('li');
    li.setAttribute('aria-hidden', 'true');
    li.innerHTML =
      '<div class="row"><div><span class="skel skel-name"></span><span class="skel skel-when"></span></div>' +
      '<span class="skel skel-button"></span></div>';
    ul.append(li);
  }
  return ul;
}

list.replaceChildren(skeleton(3));

async function load() {
  try {
    const res = await fetch('/api/projects');
    if (!res.ok) throw new Error(`projects returned ${res.status}`);
    const { projects } = await res.json();
    render(projects);
  } catch (err) {
    list.innerHTML = '';
    say(`Could not load projects: ${err.message}`);
  }
  loadRunning();
  loadUsage();
  loadStatus();
}

async function loadRunning() {
  try {
    const res = await fetch('/api/running');
    const { running } = await res.json();
    if (!res.ok || running.length === 0) {
      runningEl.replaceChildren();
      return;
    }

    const heading = document.createElement('h2');
    heading.textContent = `Running (${running.length})`;

    const ul = document.createElement('ul');
    for (const session of running) {
      ul.append(runningCard(session));
    }

    runningEl.replaceChildren(heading, ul);
  } catch {
    runningEl.replaceChildren(); // not worth an error banner
  }
}

function runningCard(session) {
  const li = document.createElement('li');

  const row = document.createElement('div');
  row.className = 'row';

  const text = document.createElement('div');
  text.innerHTML = '<span class="dot"></span><span class="name"></span><span class="when"></span>';
  text.querySelector('.name').textContent = session.name;
  text.querySelector('.when').textContent = `${session.project} · ${session.status}`;
  if (session.status === 'working') text.querySelector('.dot').classList.add('working');

  const stop = document.createElement('button');
  stop.className = 'stop';
  stop.textContent = 'Stop';
  stop.addEventListener('click', () => stopSession(session, stop));

  row.append(text, stop);
  li.append(row);
  return li;
}

async function stopSession(session, button) {
  button.disabled = true;
  button.textContent = 'Stopping…';

  try {
    const res = await fetch('/api/stop', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pid: session.pid }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `stop returned ${res.status}`);
    say(data.output);
    setTimeout(load, 500); // give the process a moment to actually go
  } catch (err) {
    say(`Could not stop ${session.name}: ${err.message}`);
    button.disabled = false;
    button.textContent = 'Stop';
  }
}

// --- Login status -----------------------------------------------------------
//
// The launcher is useless if either login has lapsed, and the way you used to
// find out was a session that started, looked fine, and never appeared on your
// phone. So both are checked against the services themselves and shown up
// front, and both can be signed back in from here.

const statusPanel = document.getElementById('status-panel');
const signinDialog = document.getElementById('signin');

const SERVICES = [
  { key: 'claude', name: 'Claude', note: 'Remote Control needs this' },
  { key: 'github', name: 'GitHub', note: 'cloning, creating and pushing need this' },
];

async function loadStatus(fresh = false) {
  try {
    const data = await (await fetch(`/api/status${fresh ? '?fresh=1' : ''}`)).json();
    renderStatus(data);
  } catch {
    statusPanel.replaceChildren(); // never let this break the page
  }
}

function renderStatus(data) {
  const card = document.createElement('div');
  card.className = 'status-card';
  for (const svc of SERVICES) card.append(serviceRow(svc, data[svc.key]));
  statusPanel.replaceChildren(card);
}

/** Days left, but only once it is close enough to be worth saying. */
function expiryNote(expiresAt) {
  if (!expiresAt) return '';
  const days = Math.floor((expiresAt - Date.now()) / 86400000);
  if (days > 7) return '';
  return days <= 0 ? ' · expires today' : ` · expires in ${days} day${days === 1 ? '' : 's'}`;
}

/**
 * Three states, not two: signed in, definitely signed out, and could-not-tell.
 * Collapsing the last into "signed out" would cry wolf every time the box was
 * briefly offline or throttled.
 */
function serviceRow(svc, state) {
  const signedOut = state && !state.ok && state.certain;
  const unknown = !state || (!state.ok && !state.certain);

  const row = document.createElement('div');
  row.className = `svc ${state && state.ok ? 'ok' : signedOut ? 'bad' : 'unknown'}`;

  const mark = document.createElement('span');
  mark.className = 'svc-mark';
  mark.textContent = state && state.ok ? '✓' : signedOut ? '✕' : '?';
  mark.setAttribute('aria-hidden', 'true');

  const text = document.createElement('div');
  text.className = 'svc-text';
  const title = document.createElement('span');
  // The tick carries no meaning on its own — the state is spelled out too, for
  // a reader that never sees the colour.
  title.textContent = state && state.ok
    ? `${svc.name} signed in`
    : signedOut
      ? `${svc.name} signed out`
      : `${svc.name} — could not check`;

  const who = document.createElement('span');
  who.className = 'svc-who';
  who.textContent = state && state.ok
    ? `${state.who || 'connected'}${expiryNote(state.expiresAt)}`
    : signedOut
      ? `${state.detail || 'not signed in'} — ${svc.note}`
      : `${(state && state.detail) || 'checking…'}`;
  text.append(title, who);

  row.append(mark, text);

  // Only offer to sign in when it is actually signed out; offer a retry when
  // the check itself failed, since signing in would not be the fix.
  if (signedOut) {
    const button = document.createElement('button');
    button.className = 'signin';
    button.textContent = 'Sign in';
    button.addEventListener('click', () => beginSignin(svc));
    row.append(button);
  } else if (unknown && state) {
    const button = document.createElement('button');
    button.className = 'signin ghost';
    button.textContent = 'Retry';
    button.addEventListener('click', () => loadStatus(true));
    row.append(button);
  }
  return row;
}

// --- Signing in from the phone ----------------------------------------------

let pollTimer = null;

function signinStep(text) {
  document.getElementById('signin-step').textContent = text;
}

async function beginSignin(svc) {
  document.getElementById('signin-title').textContent = `Sign in to ${svc.name}`;
  document.getElementById('signin-body').replaceChildren();
  signinStep('Starting…');
  signinDialog.showModal();

  // Stop polling as soon as it closes, however it closed.
  signinDialog.addEventListener('close', () => clearInterval(pollTimer), { once: true });

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ service: svc.key }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `sign-in returned ${res.status}`);
    showSigninStep(svc, data);
  } catch (err) {
    signinStep(`Could not start sign-in: ${err.message}`);
  }
}

function showSigninStep(svc, data) {
  const body = document.getElementById('signin-body');
  body.replaceChildren();

  if (data.code) {
    // GitHub: the code is entered on github.com, never sent back through here.
    signinStep('Open this on your phone and enter the code:');
    const code = document.createElement('span');
    code.className = 'bigcode';
    code.textContent = data.code;
    const link = document.createElement('a');
    link.className = 'golink';
    link.href = data.url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'Open github.com/login/device';
    body.append(code, link);
    pollUntilDone(svc);
    return;
  }

  if (data.url) {
    // Claude: approve on the phone, then paste the code it hands back.
    signinStep('Open this on your phone, approve, then paste the code it gives you:');
    const link = document.createElement('a');
    link.className = 'golink';
    link.href = data.url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'Open the Claude sign-in page';

    const input = document.createElement('input');
    input.id = 'code-input';
    input.placeholder = 'Paste the code here';
    input.autocapitalize = 'off';
    input.autocomplete = 'off';
    input.spellcheck = false;

    const submit = document.createElement('button');
    submit.textContent = 'Finish sign-in';
    submit.addEventListener('click', async () => {
      const code = input.value.trim();
      if (!code) return;
      submit.disabled = true;
      signinStep('Finishing…');
      try {
        const res = await fetch('/api/login/code', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ service: svc.key, code }),
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || `sign-in returned ${res.status}`);
        settleSignin(svc, result);
      } catch (err) {
        signinStep(`Could not finish: ${err.message}`);
        submit.disabled = false;
      }
    });

    body.append(link, input, submit);
    return;
  }

  signinStep('Waiting…');
  pollUntilDone(svc);
}

function pollUntilDone(svc) {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const state = await (await fetch(`/api/login?service=${encodeURIComponent(svc.key)}`)).json();
      if (state.state === 'waiting') return;
      settleSignin(svc, state);
    } catch {
      // A blip while polling is not worth tearing the dialog down for.
    }
  }, 3000);
}

function settleSignin(svc, state) {
  clearInterval(pollTimer);
  if (state.state === 'done') {
    signinStep(`${svc.name} is signed in.`);
    document.getElementById('signin-body').replaceChildren();
    loadStatus(true);
    load();
    setTimeout(() => signinDialog.close(), 1200);
    return;
  }
  if (state.state === 'failed') {
    signinStep(`Sign-in failed: ${state.message || 'unknown error'}`);
    return;
  }
  signinStep('Still waiting — finish it on your phone.');
}

// --- Usage ------------------------------------------------------------------
//
// The same bars the Claude app shows: the five hour session window and the
// weekly limits, as reported by the account itself. Nothing here is derived or
// estimated — the percentages come from Anthropic.

const usageEl = document.getElementById('usage');

// Whether the box can send a notification at all, and whether one is pending.
let notify = { enabled: false, remindAt: null };
let lastLimits = [];

async function loadUsage() {
  try {
    const res = await fetch('/api/usage');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `usage returned ${res.status}`);
    notify = data.notify || notify;
    renderUsage(data.limits);
  } catch {
    // The endpoint behind this is internal and unsupported, so treat it as
    // optional: the launcher's actual job is starting sessions.
    usageEl.replaceChildren();
  }
}

function renderUsage(limits = lastLimits) {
  lastLimits = limits;
  if (!limits || limits.length === 0) {
    usageEl.replaceChildren();
    return;
  }

  const heading = document.createElement('h2');
  heading.textContent = 'Usage';

  const card = document.createElement('div');
  card.className = 'usage-card';
  for (const limit of limits) card.append(limitBar(limit));

  usageEl.replaceChildren(heading, card);
}

function limitBar(limit) {
  const wrap = document.createElement('div');

  const head = document.createElement('div');
  head.className = 'limit-head';
  head.innerHTML = '<span class="limit-label"></span><span class="limit-pct"></span>';
  head.querySelector('.limit-label').textContent = limit.label;
  head.querySelector('.limit-pct').textContent = `${Math.round(limit.percent)}%`;

  const track = document.createElement('div');
  track.className = 'track';
  const fill = document.createElement('div');
  fill.className = 'fill';
  if (limit.severity !== 'normal') fill.classList.add(limit.severity);
  fill.style.width = `${Math.min(100, Math.max(0, limit.percent))}%`;
  track.append(fill);

  wrap.append(head, track);

  if (limit.resetsAt) {
    const reset = document.createElement('div');
    reset.className = 'limit-reset';
    reset.textContent = `Resets ${resetLabel(limit.resetsAt)}`;
    wrap.append(reset);
  }

  // Only the five hour window, and only once it is worth worrying about —
  // "getting close" is the account's own severity, not a threshold guessed
  // here. Still shown once a reminder is set, so it can be called off.
  const worthOffering = limit.severity !== 'normal' || notify.remindAt;
  if (limit.kind === 'session' && notify.enabled && limit.resetsAt && worthOffering) {
    wrap.append(remindButton());
  }
  return wrap;
}

function remindButton() {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = notify.remindAt ? 'remind on' : 'remind';
  button.textContent = notify.remindAt ? '✓ Reminder set — tap to cancel' : 'Notify me when it resets';

  button.addEventListener('click', async () => {
    const turningOn = !notify.remindAt;
    button.disabled = true;
    try {
      const res = await fetch('/api/remind', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ on: turningOn }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `remind returned ${res.status}`);
      notify.remindAt = data.remindAt;
      say(turningOn ? `You'll get a notification at ${resetLabel(data.remindAt)}.` : 'Reminder cancelled.');
      renderUsage();
    } catch (err) {
      say(`Could not set the reminder: ${err.message}`);
      button.disabled = false;
    }
  });

  return button;
}

const resetTime = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
const resetDay = new Intl.DateTimeFormat(undefined, {
  weekday: 'short',
  hour: 'numeric',
  minute: '2-digit',
});

/** A weekly limit resets days out, where a bare clock time would be a lie. */
function resetLabel(ms) {
  const sameDay = new Date().toDateString() === new Date(ms).toDateString();
  return (sameDay ? resetTime : resetDay).format(ms);
}

const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
const UNITS = [
  ['year', 31536000],
  ['month', 2592000],
  ['week', 604800],
  ['day', 86400],
  ['hour', 3600],
  ['minute', 60],
];

function ago(ms) {
  if (!ms) return 'never used';
  const seconds = (ms - Date.now()) / 1000;
  for (const [unit, size] of UNITS) {
    if (Math.abs(seconds) >= size) return rtf.format(Math.round(seconds / size), unit);
  }
  return rtf.format(Math.round(seconds), 'second');
}

function render(projects) {
  if (!projects || projects.length === 0) {
    list.innerHTML = '<p class="note">No projects found. Clone one into the projects directory to get started.</p>';
    return;
  }

  const ul = document.createElement('ul');
  for (const project of projects) {
    ul.append(projectCard(project));
  }

  list.innerHTML = '';
  list.append(ul);
}

const TRASH_ICON =
  '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';

function projectCard(project) {
  const li = document.createElement('li');
  li.className = 'project';

  const row = document.createElement('div');
  row.className = 'row';

  const name = document.createElement('div');
  name.innerHTML =
    '<span class="name"></span><span class="when with-sync"><span class="ago"></span><span class="sync"></span></span>';
  name.querySelector('.name').textContent = project.name;
  name.querySelector('.ago').textContent = ago(project.lastUsed);
  checkSync(project.name, name.querySelector('.sync'));

  const start = document.createElement('button');
  start.textContent = 'Start';
  start.addEventListener('click', () => launch(project.name, null, start));

  const sessions = document.createElement('div');
  sessions.className = 'sessions';

  const actions = document.createElement('div');
  actions.className = 'actions';

  // lastUsed is 0 when the project has no transcripts, so there is nothing to
  // resume and the button would only ever open an empty list.
  if (project.lastUsed) {
    const resume = document.createElement('button');
    resume.className = 'ghost';
    resume.textContent = 'Resume';
    resume.addEventListener('click', () => toggleSessions(project.name, sessions, resume));
    actions.append(resume);
  }

  actions.append(start);

  row.append(name, actions);

  const behind = document.createElement('div');
  behind.className = 'behind';
  const trash = document.createElement('button');
  trash.type = 'button';
  trash.className = 'trash';
  trash.setAttribute('aria-label', `Delete ${project.name}`);
  trash.innerHTML = TRASH_ICON;
  trash.addEventListener('click', () => askDelete(project.name));
  behind.append(trash);

  const front = document.createElement('div');
  front.className = 'front';
  front.append(row, sessions);

  li.append(behind, front);
  makeSwipeable(li, front);
  return li;
}

const SWIPE_OPEN = 76; // matches .behind's width

/**
 * Swipe left to reveal the delete button.
 *
 * Pointer events rather than touch events, so a mouse drag works the same way.
 * The gesture commits to an axis on the first few pixels of movement: if the
 * finger is going down the page, this lets go entirely and the page scrolls,
 * which otherwise makes the whole list feel stuck.
 */
function makeSwipeable(li, front) {
  let startX = 0;
  let startY = 0;
  let offset = 0;
  let tracking = false;
  let horizontal = false;

  front.addEventListener('pointerdown', (event) => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    startX = event.clientX;
    startY = event.clientY;
    offset = li.classList.contains('open') ? SWIPE_OPEN : 0;
    tracking = true;
    horizontal = false;
  });

  front.addEventListener('pointermove', (event) => {
    if (!tracking) return;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    if (!horizontal) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return; // still ambiguous
      if (Math.abs(dy) > Math.abs(dx)) {
        tracking = false; // a scroll, not a swipe
        return;
      }
      horizontal = true;
      li.classList.add('dragging');
      front.setPointerCapture(event.pointerId);
    }

    // Travel is measured as a positive distance regardless of direction, so
    // only this line knows the row opens leftwards. Clamped a little past the
    // stop so the gesture doesn't feel walled.
    const travel = -dx + (li.classList.contains('open') ? SWIPE_OPEN : 0);
    offset = Math.max(0, Math.min(SWIPE_OPEN + 20, travel));
    front.style.transform = `translateX(${-offset}px)`;
  });

  const settle = () => {
    if (!tracking) return;
    tracking = false;
    li.classList.remove('dragging');
    front.style.transform = '';
    if (!horizontal) return; // a tap; leave the row as it was
    setOpen(li, offset > SWIPE_OPEN / 2);
  };

  front.addEventListener('pointerup', settle);
  front.addEventListener('pointercancel', settle);
}

/** One row open at a time, the way a mail list behaves. */
function setOpen(li, open) {
  if (open) {
    for (const other of document.querySelectorAll('li.project.open')) {
      if (other !== li) other.classList.remove('open');
    }
  }
  li.classList.toggle('open', open);
}

// --- Compared with upstream -------------------------------------------------
//
// Whether each project is behind its remote needs a git fetch, one network
// round trip per repository. So the list goes up first, each card shows a
// spinner, and the badges fill in as their fetches come back. Each project is
// fetched once per page load; the list re-renders after every start and stop,
// and those reuse what this page load already learned.

const syncStates = new Map(); // project -> 'pending' or the server's answer
const syncEls = new Map(); // project -> its card's current .sync element
const syncQueue = [];
let syncActive = 0;

// The browser opens at most six connections to one host and queues the rest.
// Three for fetching leaves room for a tap on Start not to wait behind them.
const SYNC_PARALLEL = 3;

function checkSync(project, el, again = false) {
  syncEls.set(project, el);
  if (again) syncStates.delete(project);

  const state = syncStates.get(project);
  if (state && state !== 'pending') return showSync(project, el, state);

  const spinner = document.createElement('span');
  spinner.className = 'spinner';
  spinner.setAttribute('role', 'img');
  spinner.setAttribute('aria-label', 'Checking for new commits');
  el.replaceChildren(spinner);

  if (state === 'pending') return; // already queued or in flight
  syncStates.set(project, 'pending');
  syncQueue.push(project);
  drainSync();
}

function drainSync() {
  while (syncActive < SYNC_PARALLEL && syncQueue.length > 0) {
    syncActive++;
    fetchSync(syncQueue.shift()).finally(() => {
      syncActive--;
      drainSync();
    });
  }
}

async function fetchSync(project) {
  let state;
  try {
    const res = await fetch(`/api/sync?project=${encodeURIComponent(project)}`);
    state = await res.json();
    if (!res.ok) state = { upstream: '?', fetchError: state.error || `sync returned ${res.status}` };
  } catch (err) {
    state = { upstream: '?', fetchError: err.message };
  }
  syncStates.set(project, state);

  const el = syncEls.get(project);
  if (el && el.isConnected) showSync(project, el, state);
}

function syncBadge(text, className, title) {
  const badge = document.createElement('span');
  badge.textContent = text;
  if (className) badge.className = `badge ${className}`;
  if (title) badge.title = title;
  return badge;
}

const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function showSync(project, el, s) {
  el.replaceChildren();
  if (!s.upstream) return; // a local-only branch has nothing to be behind

  if (s.fetchError) {
    el.append(syncBadge('could not check for new commits', null, s.fetchError));
  } else if (s.behind && s.ahead) {
    el.append(syncBadge(`diverged: ${s.behind} behind, ${s.ahead} ahead`, 'diverged', s.upstream));
  } else if (s.ahead) {
    el.append(syncBadge(`${plural(s.ahead, 'commit')} not pushed`, null, s.upstream));
  } else if (!s.behind) {
    el.append(syncBadge('✓ up to date', null, s.upstream));
  } else {
    el.append(syncBadge(`${s.behind} behind`, 'stale', s.upstream));
    if (s.dirty) {
      el.append(syncBadge('uncommitted changes'));
    } else {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'pull';
      button.textContent = 'Pull';
      button.addEventListener('click', () => pull(project, button));
      el.append(button);
    }
  }
}

async function pull(project, button) {
  button.disabled = true;
  button.textContent = 'Pulling…';
  say(`Pulling ${project}…`);

  try {
    const res = await fetch('/api/pull', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ project }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `pull returned ${res.status}`);
    say(data.output || `${project} is up to date.`);
    checkSync(project, syncEls.get(project), true);
  } catch (err) {
    say(`Could not pull ${project}: ${err.message}`);
    button.disabled = false;
    button.textContent = 'Pull';
  }
}

const confirmDialog = document.getElementById('confirm');

/**
 * What deleting this would actually cost, in the project's own terms. A
 * generic "this can't be undone" is easy to click past; "3 commits have never
 * been pushed" is not.
 */
function riskText(risk) {
  if (!risk.isRepo) {
    return { text: 'Not a git repository — nothing here is backed up anywhere.', bad: true };
  }

  const losses = [];
  if (!risk.remote) losses.push('no GitHub remote, so nothing has ever been pushed');
  if (risk.unpushed) losses.push(`${risk.unpushed} commit${risk.unpushed === 1 ? '' : 's'} not pushed`);
  if (risk.uncommitted) {
    losses.push(`${risk.uncommitted} file${risk.uncommitted === 1 ? '' : 's'} with uncommitted changes`);
  }

  if (losses.length === 0) {
    return { text: `Everything is committed and pushed to ${risk.remote}.`, bad: false };
  }
  return { text: `You would lose: ${losses.join(', ')}.`, bad: true };
}

async function askDelete(project) {
  document.getElementById('confirm-name').textContent = project;

  const riskEl = document.getElementById('confirm-risk');
  riskEl.textContent = 'Checking what is backed up…';
  riskEl.className = 'risk';
  confirmDialog.showModal();

  try {
    const res = await fetch(`/api/risk?project=${encodeURIComponent(project)}`);
    const risk = await res.json();
    if (!res.ok) throw new Error(risk.error || `risk returned ${res.status}`);
    const { text, bad } = riskText(risk);
    riskEl.textContent = text;
    riskEl.className = bad ? 'risk bad' : 'risk';
  } catch (err) {
    // Failing to check is itself a reason for caution, so say so rather than
    // quietly showing nothing.
    riskEl.textContent = `Could not check what is backed up: ${err.message}`;
    riskEl.className = 'risk bad';
  }

  confirmDialog.addEventListener(
    'close',
    () => {
      if (confirmDialog.returnValue === 'delete') doDelete(project);
    },
    { once: true },
  );
}

async function doDelete(project) {
  say(`Deleting ${project}…`);
  try {
    const res = await fetch('/api/delete', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ project }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `delete returned ${res.status}`);
    say(data.output);
    load();
  } catch (err) {
    say(`Could not delete ${project}: ${err.message}`);
  }
}

async function toggleSessions(project, container, button) {
  if (container.childElementCount > 0) {
    container.replaceChildren();
    button.textContent = 'Resume';
    return;
  }

  button.disabled = true;
  try {
    const res = await fetch(`/api/sessions?project=${encodeURIComponent(project)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `sessions returned ${res.status}`);

    if (data.sessions.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'note';
      empty.textContent = 'No past sessions.';
      container.append(empty);
    } else {
      for (const session of data.sessions) {
        container.append(sessionButton(project, session));
      }
    }
    button.textContent = 'Hide';
  } catch (err) {
    say(`Could not load sessions: ${err.message}`);
  } finally {
    button.disabled = false;
  }
}

function sessionButton(project, session) {
  const button = document.createElement('button');
  button.className = 'session';

  const text = document.createElement('span');
  text.innerHTML = '<span class="label"></span><span class="when"></span>';
  text.querySelector('.label').textContent = session.label || '(no prompt recorded)';
  text.querySelector('.when').textContent = ago(session.lastUsed);

  button.append(text);
  button.addEventListener('click', () => launch(project, session.id, button));
  return button;
}

async function launch(project, sessionId, button) {
  const label = button.textContent;
  button.disabled = true;
  say(sessionId ? `Resuming ${project}…` : `Starting ${project}…`);

  try {
    const res = await fetch('/api/start', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ project, session: sessionId || undefined }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `start returned ${res.status}`);
    say(`${data.output}\nOpen the Claude app to continue.`);

    // Deliberately not re-enabled. start-session returns once tmux is up, in
    // well under a second, but Claude needs about ten more to register — and
    // multiple sessions per project are allowed, so a second tap in that gap
    // silently starts a second session. Reload once it has registered, which
    // both re-renders this card and shows the session under Running.
    button.textContent = 'Started';
    setTimeout(load, 10000);
  } catch (err) {
    say(`Could not start ${project}: ${err.message}`);
    button.disabled = false;
    button.textContent = label;
  }
}

// Repositories load on first expand, not on page load — it's a network round
// trip to GitHub for something most visits never open.
const addEl = document.getElementById('add');
const reposEl = document.getElementById('repos');
let reposLoaded = false;

addEl.addEventListener('toggle', () => {
  if (addEl.open && !reposLoaded) loadRepos();
});

async function loadRepos() {
  reposLoaded = true;
  if (!reposEl.querySelector('ul:not(.skeleton)')) reposEl.replaceChildren(skeleton(2));
  try {
    const res = await fetch('/api/github/repos');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `repos returned ${res.status}`);

    if (data.repos.length === 0) {
      reposEl.innerHTML = '<p class="note">Every repository is already cloned here.</p>';
      return;
    }

    const ul = document.createElement('ul');
    for (const repo of data.repos) {
      ul.append(repoCard(repo));
    }
    reposEl.replaceChildren(ul);
  } catch (err) {
    reposLoaded = false; // let them retry by collapsing and reopening
    reposEl.innerHTML = '<p class="note"></p>';
    reposEl.querySelector('.note').textContent = `Could not list repositories: ${err.message}`;
  }
}

function repoCard(repo) {
  const li = document.createElement('li');
  const row = document.createElement('div');
  row.className = 'row';

  const text = document.createElement('div');
  text.innerHTML = '<span class="name"></span><span class="desc"></span>';
  text.querySelector('.name').textContent = repo.repo;
  text.querySelector('.desc').textContent = repo.description || '';

  const button = document.createElement('button');
  button.className = 'ghost';
  button.textContent = 'Clone';
  button.addEventListener('click', () => post('/api/clone', { repo: repo.repo }, button, `Cloning ${repo.repo}…`));

  row.append(text, button);
  li.append(row);
  return li;
}

document.getElementById('create-form').addEventListener('submit', (event) => {
  event.preventDefault();
  const name = document.getElementById('create-name').value.trim();
  const isPrivate = document.getElementById('create-private').checked;
  const button = event.target.querySelector('button');
  post('/api/create', { name, private: isPrivate }, button, `Creating ${name}…`);
});

/** Clone and create both end in a started session and a changed project list. */
async function post(path, body, button, pending) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = '…';
  say(pending);

  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `${path} returned ${res.status}`);
    say(`${data.output}\nOpen the Claude app to continue.`);
    reposLoaded = false;
    load();
    if (addEl.open) loadRepos();
  } catch (err) {
    say(err.message);
  } finally {
    button.disabled = false;
    button.textContent = label;
  }
}

load();

// Keep the bars live while the page sits open. The server caches for the same
// interval, so this is at most one call a minute to Anthropic.
setInterval(loadUsage, 60000);
</script>
</body>
</html>
