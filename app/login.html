<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Claude Box</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card: #ffffff;
    --text: #161b22;
    --muted: #59646f;
    --line: #d9e0e7;
    --accent: #a94d26;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141a;
      --card: #171d25;
      --text: #dde3ea;
      --muted: #8a97a5;
      --line: #252d38;
      --accent: #e0855a;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 360px; margin: 0 auto; padding: 72px 16px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0 0 20px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  /* 16px, so iOS does not zoom the page when the field is tapped. */
  input, button {
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  input { background: var(--card); color: var(--text); }
  button { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  p { color: var(--muted); font-size: 14px; min-height: 1.4em; margin: 4px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Claude Box</h1>
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
  </form>
  <p role="alert"><!--message--></p>
</main>
</body>
</html>
